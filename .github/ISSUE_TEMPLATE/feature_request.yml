name: 💡 Feature Request
description: Suggest an idea or enhancement for CipherLock.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please describe the feature you would like to see added to CipherLock.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am trying to... but currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or enhancement you would like to see implemented.
      placeholder: It would be great if CipherLock could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Any alternative solutions or features you have considered.
    validations:
      required: false
